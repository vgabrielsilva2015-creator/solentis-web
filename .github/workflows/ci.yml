name: CI

# Roda em todo push e em todo PR para a main.
# O objetivo principal é o GUARDIÃO DE ISOLAMENTO MULTI-TENANT:
# se qualquer query esquecer o tenant_id, o build falha aqui e bloqueia o merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolamento-e-qualidade:
    name: Isolamento multi-tenant + Testes + Typecheck
    runs-on: ubuntu-latest

    # Os testes NÃO conectam ao banco (são puros / análise estática).
    # Estas variáveis são apenas placeholders para o Prisma não reclamar de env ausente.
    # NÃO são credenciais reais e nunca conectam a lugar nenhum.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci
        # O postinstall do projeto roda "prisma generate". Em CI sem DATABASE_URL isso
        # ainda funciona para gerar o client (não precisa de conexão), mas garantimos abaixo.

      - name: 🛡️ Gate de segurança — vulnerabilidades HIGH em produção
        # Falha o build se houver vuln HIGH/CRITICAL nas dependências de PRODUÇÃO.
        # --omit=dev de propósito: vulns de tooling de dev (vite/jsdom) não devem
        # bloquear deploys; o que importa é o que roda em runtime na Vercel.
        run: npm audit --omit=dev --audit-level=high

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: 🔒 GUARDIÃO — Isolamento multi-tenant + suite de testes
        # --no-cache é OBRIGATÓRIO: o teste de isolamento lê arquivos do disco via fs,
        # e o cache do Vitest poderia mascarar um vazamento recém-introduzido.
        run: npx vitest run --no-cache

      - name: Verificação de tipos (TypeScript)
        run: npx tsc --noEmit

      # T-29: lint passa a bloquear (0 erros; os avisos continuam listados). Antes tinha 192 erros.
      - name: Lint (ESLint)
        run: npm run lint

      # T-29: o build também bloqueia o merge. Variáveis abaixo são só placeholders para o build
      # não reclamar de env ausente; não conectam a lugar nenhum.
      - name: Build (Next.js)
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-nao-e-segredo-real-0123456789abcdef
          NEXTAUTH_URL: http://localhost:3000

  # T-28 — testes de integração: Postgres de verdade, migrations aplicadas do zero.
  # O banco é efêmero (serviço do próprio job); os testes se recusam a rodar em outro lugar
  # (src/test/db.ts: host local + nome terminando em _int/_test/_ci).
  integracao:
    name: Integração (Postgres + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: solentis_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d solentis_int"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # placeholders para o Prisma; o banco real dos testes vem de INTEGRATION_DATABASE_URL
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
      INTEGRATION_DATABASE_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Aplicar as migrations do zero (valida o baseline)
        run: npx prisma migrate deploy
      - name: Testes de integração
        run: npm run test:integration

  # T-29 — varredura de segredos no histórico e revisão de dependências novas em PRs.
  seguranca:
    name: Segurança (segredos + dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (segredos no código e no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Revisão de dependências (só em PR)
        if: github.event_name == 'pull_request'
        # Exige o "Dependency graph" habilitado em Settings > Code security do repo.
        # Enquanto estiver desligado, a action aborta ("not supported on this repository").
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # T-29 — E2E (Playwright) contra o app construído neste job, com Postgres de serviço e o seed.
  # VERIFICADO VERDE (PR #51): passou a ser obrigatório — se o smoke quebrar, bloqueia o merge.
  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: solentis_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d solentis_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/solentis_e2e_test?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/solentis_e2e_test?schema=public"
      AUTH_SECRET: ci-placeholder-nao-e-segredo-real-0123456789abcdef
      # NextAuth v5 rejeita o host (UntrustedHost) atrás do proxy do CI sem isto -> login falhava no smoke.
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: ci-cron-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Subir o app e rodar o smoke
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000/login --timeout 60000
          npx playwright test smoke

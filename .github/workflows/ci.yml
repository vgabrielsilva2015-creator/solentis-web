name: CI

# Roda em todo push e em todo PR para a main.
# O objetivo principal é o GUARDIÃO DE ISOLAMENTO MULTI-TENANT:
# se qualquer query esquecer o tenant_id, o build falha aqui e bloqueia o merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolamento-e-qualidade:
    name: Isolamento multi-tenant + Testes + Typecheck
    runs-on: ubuntu-latest

    # Os testes NÃO conectam ao banco (são puros / análise estática).
    # Estas variáveis são apenas placeholders para o Prisma não reclamar de env ausente.
    # NÃO são credenciais reais e nunca conectam a lugar nenhum.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci
        # O postinstall do projeto roda "prisma generate". Em CI sem DATABASE_URL isso
        # ainda funciona para gerar o client (não precisa de conexão), mas garantimos abaixo.

      - name: 🛡️ Gate de segurança — vulnerabilidades HIGH em produção
        # Falha o build se houver vuln HIGH/CRITICAL nas dependências de PRODUÇÃO.
        # --omit=dev de propósito: vulns de tooling de dev (vite/jsdom) não devem
        # bloquear deploys; o que importa é o que roda em runtime na Vercel.
        run: npm audit --omit=dev --audit-level=high

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: 🔒 GUARDIÃO — Isolamento multi-tenant + suite de testes
        # --no-cache é OBRIGATÓRIO: o teste de isolamento lê arquivos do disco via fs,
        # e o cache do Vitest poderia mascarar um vazamento recém-introduzido.
        run: npx vitest run --no-cache

      - name: Verificação de tipos (TypeScript)
        run: npx tsc --noEmit

  # T-28 — testes de integração: Postgres de verdade, migrations aplicadas do zero.
  # O banco é efêmero (serviço do próprio job); os testes se recusam a rodar em outro lugar
  # (src/test/db.ts: host local + nome terminando em _int/_test/_ci).
  integracao:
    name: Integração (Postgres + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: solentis_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d solentis_int"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # placeholders para o Prisma; o banco real dos testes vem de INTEGRATION_DATABASE_URL
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
      INTEGRATION_DATABASE_URL: "postgresql://ci:ci@localhost:5432/solentis_int?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Aplicar as migrations do zero (valida o baseline)
        run: npx prisma migrate deploy
      - name: Testes de integração
        run: npm run test:integration
